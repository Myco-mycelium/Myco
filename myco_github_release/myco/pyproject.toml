[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "myco"
version = "2.0.0"
description = "A self-growing, lifelong-learning AI entity"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "litellm>=1.40.0",
    "chromadb>=0.5.0",
    "networkx>=3.3",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "duckduckgo-search>=6.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx"]

[project.scripts]
myco = "api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "memory*", "models*", "tools*", "safety*", "api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["safety/tests"]
