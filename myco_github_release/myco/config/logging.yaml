# myco/config/logging.yaml
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    # Structured JSON logging for production log aggregation (Loki, Splunk, etc.)
    # Requires python-json-logger: pip install python-json-logger
    "()": "pythonjsonlogger.jsonlogger.JsonFormatter"
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout
    level: INFO

  file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    filename: data/myco.log
    maxBytes: 10485760   # 10 MB
    backupCount: 5
    level: DEBUG

  security_file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    filename: data/security.log
    maxBytes: 10485760   # 10 MB
    backupCount: 10
    level: WARNING

loggers:
  myco:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  myco.auth:
    level: DEBUG
    handlers: [console, file, security_file]
    propagate: false

  myco.sandbox:
    level: DEBUG
    handlers: [console, file, security_file]
    propagate: false

  myco.audit:
    level: DEBUG
    handlers: [console, file, security_file]
    propagate: false

  # Silence noisy third-party loggers
  litellm:
    level: WARNING
  httpx:
    level: WARNING
  chromadb:
    level: WARNING

root:
  level: WARNING
  handlers: [console]
